  - id: schedule_running
    type: bool
    restore_value: no
    initial_value: "false"
 
  - id: skip_result
    type: bool
    restore_value: no
    initial_value: "false"
 
  - id: last_run_day_1
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_2
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_3
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_4
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_5
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_6
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_7
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_8
    type: int
    restore_value: no
    initial_value: "-1"

  - id: align_delay_secs
    type: int
    restore_value: no
    initial_value: "0"
 
# ─────────────────────────────────────────────────────────────────
# SCRIPTS
# ─────────────────────────────────────────────────────────────────
script:
  # ── Aligned 5-minute poll – started by on_loop once SNTP valid, repeats forever
  - id: schedule_poll
    mode: single
    then:
      - delay: !lambda "return (uint32_t)(id(align_delay_secs) * 1000);"
      - while:
          condition:
            lambda: "return true;"
          then:
            - lambda: |-
                auto t = id(local_time).now();
                ESP_LOGI("watering", "Schedule poll – current %02d:%02d", t.hour, t.minute);
                // Midnight reset of manual skip
                if (t.hour == 0 && t.minute == 0) {
                  if (id(manual_skip)) {
                    id(manual_skip) = false;
                    ESP_LOGI("watering", "Manual skip auto-reset at midnight");
                  }
                }
                // Fire if any enabled slot matches and hasn't already run today
                struct Slot { bool en; int hr; int mn; int *last; int idx; };
                Slot slots[] = {
                  {id(slot1_enabled), id(slot1_hour), id(slot1_minute), &id(last_run_day_1), 1},
                  {id(slot2_enabled), id(slot2_hour), id(slot2_minute), &id(last_run_day_2), 2},
                  {id(slot3_enabled), id(slot3_hour), id(slot3_minute), &id(last_run_day_3), 3},
                  {id(slot4_enabled), id(slot4_hour), id(slot4_minute), &id(last_run_day_4), 4},
                  {id(slot5_enabled), id(slot5_hour), id(slot5_minute), &id(last_run_day_5), 5},
                  {id(slot6_enabled), id(slot6_hour), id(slot6_minute), &id(last_run_day_6), 6},
                  {id(slot7_enabled), id(slot7_hour), id(slot7_minute), &id(last_run_day_7), 7},
                  {id(slot8_enabled), id(slot8_hour), id(slot8_minute), &id(last_run_day_8), 8},
                };
                for (auto &s : slots) {
                  if (s.en && t.hour == s.hr && t.minute == s.mn && *s.last != t.day_of_year) {
                    *s.last = t.day_of_year;
                    ESP_LOGI("watering", "Slot %d firing (%02d:%02d)", s.idx, s.hr, s.mn);
                    id(run_full_schedule).execute();
                    break;
                  }
                }
                // Calculate seconds until next 5-minute boundary +10s
                int secs_to_next = (5 - (t.minute % 5)) * 60 - t.second + 10;
                if (secs_to_next <= 10) secs_to_next += 300;
                ESP_LOGI("watering", "Next poll in %d seconds", secs_to_next);
                id(align_delay_secs) = secs_to_next;
            - delay: !lambda "return (uint32_t)(id(align_delay_secs) * 1000);"
 
  # ── Transformer relay follows active_channels count
  - id: update_transformer
    then:
      - if:
          condition:
            lambda: "return id(active_channels) > 0;"
          then:
            - switch.turn_on: relay_ch8_transformer
          else:
            - switch.turn_off: relay_ch8_transformer
 
  # ── Evaluate all skip conditions, result stored in skip_result
  - id: check_skip_conditions
    then:
      - lambda: |-
          bool skip = false;
          if (!id(master_enabled)) {
            ESP_LOGI("watering", "Skip: master disabled");
            skip = true;
          }
          if (id(manual_skip)) {
            ESP_LOGI("watering", "Skip: manual skip active");
            skip = true;
          }
          if (!id(weather_ok)) {
            ESP_LOGI("watering", "Skip: weather not OK");
            skip = true;
          }
          id(skip_result) = skip;
 
  # ── Full sequential watering run
  - id: run_full_schedule
    mode: single
    then:
      - script.execute: check_skip_conditions
      - if:
          condition:
            lambda: "return id(skip_result);"
          then:
            - logger.log: "Scheduled run SKIPPED"
            - homeassistant.event:
                event: esphome.watering_skipped
                data: {}
          else:
            - globals.set:
                id: schedule_running
                value: "true"
            - logger.log: "Watering schedule START"
            - homeassistant.event:
                event: esphome.watering_started
                data:
                  trigger: schedule
 
            - if:
                condition:
                  lambda: "return id(duration_z1) > 0;"
                then:
                  - switch.turn_on: relay_ch1
                  - delay: !lambda "return (uint32_t)(id(duration_z1) * 60000);"
                  - switch.turn_off: relay_ch1
                else:
                  - logger.log: "Zone 1 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z2) > 0;"
                then:
                  - switch.turn_on: relay_ch2
                  - delay: !lambda "return (uint32_t)(id(duration_z2) * 60000);"
                  - switch.turn_off: relay_ch2
                else:
                  - logger.log: "Zone 2 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z3) > 0;"
                then:
                  - switch.turn_on: relay_ch3
                  - delay: !lambda "return (uint32_t)(id(duration_z3) * 60000);"
                  - switch.turn_off: relay_ch3
                else:
                  - logger.log: "Zone 3 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z4) > 0;"
                then:
                  - switch.turn_on: relay_ch4
                  - delay: !lambda "return (uint32_t)(id(duration_z4) * 60000);"
                  - switch.turn_off: relay_ch4
                else:
                  - logger.log: "Zone 4 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z5) > 0;"
                then:
                  - switch.turn_on: relay_ch5
                  - delay: !lambda "return (uint32_t)(id(duration_z5) * 60000);"
                  - switch.turn_off: relay_ch5
                else:
                  - logger.log: "Zone 5 skipped (duration 0)"
 
            - globals.set:
                id: schedule_running
                value: "false"
            - globals.set:
                id: last_watered_epoch
                value: !lambda "return (int)id(local_time).now().timestamp;"
            - logger.log: "Watering schedule COMPLETE"
            - homeassistant.event:
                event: esphome.watering_complete
                data:
                  trigger: schedule
 
  # ── Hard stop – all zones off immediately
  - id: emergency_stop
    then:
      - script.stop: run_full_schedule
      - switch.turn_off: relay_ch1
      - switch.turn_off: relay_ch2
      - switch.turn_off: relay_ch3
      - switch.turn_off: relay_ch4
      - switch.turn_off: relay_ch5
      - globals.set:
          id: active_channels
          value: "0"
      - script.execute: update_transformer
      - globals.set:
          id: schedule_running
          value: "false"
      - logger.log: "EMERGENCY STOP – all zones off"
      - homeassistant.event:
          event: esphome.watering_emergency_stop
          data: {}
 
  # ── Log restored state on boot
  - id: restore_schedule_state
    then:
      - logger.log:
          format: "Boot – slots [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d master:%d weather_ok:%d manual_skip:%d"
          args:
            - "id(slot1_enabled)"
            - "id(slot1_hour)"
            - "id(slot1_minute)"
            - "id(slot2_enabled)"
            - "id(slot2_hour)"
            - "id(slot2_minute)"
            - "id(slot3_enabled)"
            - "id(slot3_hour)"
            - "id(slot3_minute)"
            - "id(slot4_enabled)"
            - "id(slot4_hour)"
            - "id(slot4_minute)"
            - "id(slot5_enabled)"
            - "id(slot5_hour)"
            - "id(slot5_minute)"
            - "id(slot6_enabled)"
            - "id(slot6_hour)"
            - "id(slot6_minute)"
            - "id(slot7_enabled)"
            - "id(slot7_hour)"
            - "id(slot7_minute)"
            - "id(slot8_enabled)"
            - "id(slot8_hour)"
            - "id(slot8_minute)"
            - "id(master_enabled)"
            - "id(weather_ok)"
            - "id(manual_skip)"
 
# ─────────────────────────────────────────────────────────────────
# SWITCHES
# Pin mapping (active-HIGH relay board):
#   CH1 → G32  Zone 1
#   CH2 → G33  Zone 2
#   CH3 → G25  Zone 3
#   CH4 → G26  Zone 4
#   CH5 → G27  Zone 5
#   CH6 → G14  (unused)
#   CH7 → G12  (unused)
#   CH8 → G13  Transformer
# ─────────────────────────────────────────────────────────────────
switch:
  # CH8 – Transformer (internal, controlled automatically)
  - platform: gpio
    id: relay_ch8_transformer
    name: "Transformer Power"
    pin:
      number: GPIO13
      inverted: false
    internal: true
    restore_mode: ALWAYS_OFF
 
  # CH1 – Zone 1
  - platform: gpio
    id: relay_ch1
    name: "Zone 1"
    icon: mdi:water
    pin:
      number: GPIO32
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++;"
        - script.execute: update_transformer
    on_turn_off:
      then:
        - lambda: "if (id(active_channels) > 0) id(active_channels)--;"
        - script.execute: update_transformer
 
  # CH2 – Zone 2
  - platform: gpio
    id: relay_ch2
    name: "Zone 2"
    icon: mdi:water
    pin:
      number: GPIO33
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++;"
        - script.execute: update_transformer
    on_turn_off:
      then:
        - lambda: "if (id(active_channels) > 0) id(active_channels)--;"
        - script.execute: update_transformer
 
  # CH3 – Zone 3
  - platform: gpio
    id: relay_ch3
    name: "Zone 3"
    icon: mdi:water
    pin:
      number: GPIO25
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++;"
        - script.execute: update_transformer
    on_turn_off:
      then:
        - lambda: "if (id(active_channels) > 0) id(active_channels)--;"
        - script.execute: update_transformer
 
  # CH4 – Zone 4
  - platform: gpio
    id: relay_ch4
    name: "Zone 4"
    icon: mdi:water
    pin:
      number: GPIO26
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++;"
        - script.execute: update_transformer
    on_turn_off:
      then:
        - lambda: "if (id(active_channels) > 0) id(active_channels)--;"
        - script.execute: update_transformer
 
  # CH5 – Zone 5
  - platform: gpio
    id: relay_ch5
    name: "Zone 5"
    icon: mdi:water
    pin:
      number: GPIO27
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++;"
        - script.execute: update_transformer
    on_turn_off:
      then:
        - lambda: "if (id(active_channels) > 0) id(active_channels)--;"
        - script.execute: update_transformer
 
  # ── Virtual control switches – globals are the source of truth (restore_value: yes)
  - platform: template
    name: "Master Enable"
    id: sw_master_enabled
    icon: mdi:power
    restore_mode: DISABLED
    lambda: "return id(master_enabled);"
    turn_on_action:
      - globals.set:
          id: master_enabled
          value: "true"
    turn_off_action:
      - globals.set:
          id: master_enabled
          value: "false"
      - if:
          condition:
            lambda: "return id(schedule_running);"
          then:
            - script.execute: emergency_stop

  - platform: template
    name: "Manual Skip Today"
    id: sw_manual_skip
    icon: mdi:skip-next
    restore_mode: DISABLED
    lambda: "return id(manual_skip);"
    turn_on_action:
      - globals.set:
          id: manual_skip
          value: "true"
      - if:
          condition:
            lambda: "return id(schedule_running);"
          then:
            - script.execute: emergency_stop
    turn_off_action:
      - globals.set:
          id: manual_skip
          value: "false"

  - platform: template
    name: "Weather OK"
    id: sw_weather_ok
    icon: mdi:weather-sunny
    restore_mode: DISABLED
    lambda: "return id(weather_ok);"
    turn_on_action:
      - globals.set:
          id: weather_ok
          value: "true"
    turn_off_action:
      - globals.set:
          id: weather_ok
          value: "false"
      - if:
          condition:
            lambda: "return id(schedule_running);"
          then:
            - script.execute: emergency_stop

  - platform: template
    name: "Schedule Slot 1 Enabled"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_ON
    lambda: "return id(slot1_enabled);"
    turn_on_action:
      globals.set:
        id: slot1_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot1_enabled
        value: "false"

  - platform: template
    name: "Schedule Slot 2 Enabled"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: "return id(slot2_enabled);"
    turn_on_action:
      globals.set:
        id: slot2_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot2_enabled
        value: "false"

  - platform: template
    name: "Schedule Slot 3 Enabled"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: "return id(slot3_enabled);"
    turn_on_action:
      globals.set:
        id: slot3_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot3_enabled
        value: "false"

  - platform: template
    name: "Schedule Slot 4 Enabled"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: "return id(slot4_enabled);"
    turn_on_action:
      globals.set:
        id: slot4_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot4_enabled
        value: "false"

  - platform: template
    name: "Schedule Slot 5 Enabled"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: "return id(slot5_enabled);"
    turn_on_action:
