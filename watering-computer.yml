# ─────────────────────────────────────────────────────────────────
# BUTTONS
# ─────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Run Full Schedule Now"
    icon: mdi:play-circle
    on_press:
      script.execute: run_full_schedule
 
  - platform: template
    name: "Emergency Stop"
    icon: mdi:stop-circle
    on_press:
      script.execute: emergency_stop
 
# ─────────────────────────────────────────────────────────────────
# DATETIME – schedule slot times (time-only, floored to 5 min)
# ─────────────────────────────────────────────────────────────────
datetime:
  - platform: template
    name: "Slot 1 Time"
    id: slot1_time
    type: time
    icon: mdi:clock-start
    update_interval: 60s
    lambda: |-
      ESPTime t{};
      t.hour = id(slot1_hour);
      t.minute = id(slot1_minute);
      t.second = 0;
      return t;
    set_action:
      - lambda: |-
          id(slot1_hour) = x.hour;
          id(slot1_minute) = (x.minute / 5) * 5;

  - platform: template
    name: "Slot 2 Time"
    id: slot2_time
    type: time
    icon: mdi:clock-start
    update_interval: 60s
    lambda: |-
      ESPTime t{};
      t.hour = id(slot2_hour);
      t.minute = id(slot2_minute);
