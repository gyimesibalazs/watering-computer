esphome:
  name: "watering-computer"
  friendly_name: Watering-Computer
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - script.execute: restore_schedule_state
  on_loop:
    then:
      - lambda: |-
          if (id(schedule_poll).is_running()) return;
          if (!id(local_time).now().is_valid()) return;
          auto t = id(local_time).now();
          int secs_to_next = (5 - (t.minute % 5)) * 60 - t.second + 10;
          if (secs_to_next > 300) secs_to_next -= 300;
          ESP_LOGI("watering", "SNTP valid at %02d:%02d – poll starts in %ds",
            t.hour, t.minute, secs_to_next);
          id(align_delay_secs) = secs_to_next;
          id(schedule_poll).execute();

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

logger:

api:
  services:
    - service: set_weather_ok
      variables:
        weather_clear: bool
      then:
        - globals.set:
            id: weather_ok
            value: !lambda "return weather_clear;"
        - logger.log:
            format: "HA pushed weather_ok = %d"
            args: ["weather_clear"]

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Watering-Computer Fallback"
    password: !secret wifi_password

captive_portal:
 
# ─────────────────────────────────────────────────────────────────
# TIME – HA is primary (fast, reliable on esp-idf), SNTP is fallback
# ─────────────────────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: local_time
    timezone: Europe/Budapest
  - platform: sntp
    timezone: Europe/Budapest
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
 
# ─────────────────────────────────────────────────────────────────
# GLOBALS – single block
# Persistent settings use restore_value: yes (saved to flash)
# Runtime-only flags use restore_value: no
# ─────────────────────────────────────────────────────────────────
globals:
