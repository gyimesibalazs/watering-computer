# ─────────────────────────────────────────────────────────────────
# SENSORS – diagnostics
# ─────────────────────────────────────────────────────────────────
sensor:
  - platform: uptime
    name: "Uptime"
    icon: mdi:clock-outline
    update_interval: 60s
 
  - platform: internal_temperature
    name: "ESP32 Temperature"
    icon: mdi:thermometer
    update_interval: 60s
 
# ─────────────────────────────────────────────────────────────────
# BINARY SENSORS – diagnostics
# ─────────────────────────────────────────────────────────────────
binary_sensor:
  - platform: template
    name: "Transformer Active"
    device_class: power
    lambda: "return id(active_channels) > 0;"
 
  - platform: template
    name: "Schedule Running"
    device_class: running
    lambda: "return id(schedule_running);"
 
  - platform: template
    name: "Watering Blocked"
    device_class: problem
    lambda: |-
      return !id(master_enabled)
          || id(manual_skip)
          || !id(weather_ok);
 
# ─────────────────────────────────────────────────────────────────
# TEXT SENSORS – diagnostics
# ─────────────────────────────────────────────────────────────────
text_sensor:
  - platform: template
    name: "Schedule Time"
    icon: mdi:clock-outline
    update_interval: 60s
    lambda: |-
      struct Slot { bool en; int hr; int mn; };
      Slot slots[] = {
        {id(slot1_enabled), id(slot1_hour), id(slot1_minute)},
        {id(slot2_enabled), id(slot2_hour), id(slot2_minute)},
        {id(slot3_enabled), id(slot3_hour), id(slot3_minute)},
        {id(slot4_enabled), id(slot4_hour), id(slot4_minute)},
        {id(slot5_enabled), id(slot5_hour), id(slot5_minute)},
        {id(slot6_enabled), id(slot6_hour), id(slot6_minute)},
        {id(slot7_enabled), id(slot7_hour), id(slot7_minute)},
        {id(slot8_enabled), id(slot8_hour), id(slot8_minute)},
      };
      std::string out;
      char buf[8];
      for (auto &s : slots) {
        if (!s.en) continue;
        snprintf(buf, sizeof(buf), "%02d:%02d", s.hr, s.mn);
        if (!out.empty()) out += ", ";
        out += buf;
      }
      return {out.empty() ? "None" : out};
 
  - platform: template
    name: "Active Zones"
    icon: mdi:water-pump
    update_interval: 5s
    lambda: |-
      if (id(active_channels) == 0) return {"None"};
      return {to_string(id(active_channels)) + " zone(s) running"};
 
  - platform: template
    name: "Skip Reason"
    icon: mdi:information
    update_interval: 30s
    lambda: |-
      std::string r = "";
      if (!id(master_enabled)) r += "Master off; ";
      if (id(manual_skip))     r += "Manual skip; ";
      if (!id(weather_ok))     r += "Weather blocked; ";
      return {r.empty() ? "Clear – will water" : r};
 
  - platform: template
    name: "Last Watered"
    icon: mdi:history
    update_interval: 60s
    lambda: |-
      if (id(last_watered_epoch) == 0) return {"Never"};
      int hours = (id(local_time).now().timestamp - id(last_watered_epoch)) / 3600;
      if (hours < 1) return {"< 1 hour ago"};
      return {to_string(hours) + "h ago"};
