    lambda: |-
      return !id(master_enabled)
          || id(manual_skip)
          || !id(weather_ok);

# ─────────────────────────────────────────────────────────────────
# TEXT SENSORS
# ─────────────────────────────────────────────────────────────────
text_sensor:
  - platform: template
    name: "Időzítések"
    icon: mdi:clock-outline
    update_interval: 60s
    web_server:
      sorting_weight: 70
      sorting_group_id: g_diag
    lambda: |-
      struct Slot { bool en; int hr; int mn; };
      Slot slots[] = {
        {id(slot1_enabled), id(slot1_hour), id(slot1_minute)},
        {id(slot2_enabled), id(slot2_hour), id(slot2_minute)},
        {id(slot3_enabled), id(slot3_hour), id(slot3_minute)},
        {id(slot4_enabled), id(slot4_hour), id(slot4_minute)},
      };
      std::string out;
      char buf[8];
      for (auto &s : slots) {
        if (!s.en) continue;
        snprintf(buf, sizeof(buf), "%02d:%02d", s.hr, s.mn);
        if (!out.empty()) out += ", ";
        out += buf;
      }
      return {out.empty() ? "Nincs" : out};

  - platform: template
    name: "Aktív zónák"
    icon: mdi:water-pump
    update_interval: 5s
    web_server:
      sorting_weight: 80
      sorting_group_id: g_diag
    lambda: |-
      if (id(active_channels) == 0) return {"Nincs"};
      return {to_string(id(active_channels)) + " zóna fut"};

  - platform: template
    name: "Kihagyás oka"
    icon: mdi:information
    update_interval: 30s
    web_server:
      sorting_weight: 90
      sorting_group_id: g_diag
    lambda: |-
      std::string r = "";
      if (!id(master_enabled)) r += "Főkapcsoló kikapcsolva; ";
      if (id(manual_skip))     r += "Mai kihagyás; ";
      if (!id(weather_ok))     r += "Időjárás letiltja; ";
      return {r.empty() ? "OK – öntözni fog" : r};

  - platform: template
    name: "Utolsó öntözés"
    icon: mdi:history
    update_interval: 60s
    web_server:
      sorting_weight: 100
      sorting_group_id: g_diag
    lambda: |-
      if (id(last_watered_epoch) == 0) return {"Soha"};
      int hours = (id(local_time).now().timestamp - id(last_watered_epoch)) / 3600;
      if (hours < 1) return {"< 1 órája"};
      return {to_string(hours) + " órája"};
