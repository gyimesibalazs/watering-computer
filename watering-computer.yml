esphome:
  name: "watering-computer"
  friendly_name: Öntözőkomputer
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - script.execute: restore_schedule_state
  on_loop:
    then:
      - lambda: |-
          if (id(schedule_poll).is_running()) return;
          if (!id(local_time).now().is_valid()) return;
          auto t = id(local_time).now();
          int secs_to_next = (5 - (t.minute % 5)) * 60 - t.second + 10;
          if (secs_to_next > 300) secs_to_next -= 300;
          ESP_LOGI("watering", "SNTP valid at %02d:%02d – poll starts in %ds",
            t.hour, t.minute, secs_to_next);
          id(align_delay_secs) = secs_to_next;
          id(schedule_poll).execute();

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

logger:

api:
  reboot_timeout: 0s
  services:
    - service: set_weather_ok
      variables:
        weather_clear: bool
      then:
        - globals.set:
            id: weather_ok
            value: !lambda "return weather_clear;"
        - logger.log:
            format: "HA pushed weather_ok = %d"
            args: ["weather_clear"]

ota:
  - platform: esphome

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: g_zones
      name: "Zónák"
      sorting_weight: 10
    - id: g_sched
      name: "Időzítés"
      sorting_weight: 20
    - id: g_program
      name: "Program"
      sorting_weight: 30
    - id: g_diag
      name: "Diagnosztika"
      sorting_weight: 60

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Öntözőkomputer Tartalék"
    password: !secret wifi_password

captive_portal:

# ─────────────────────────────────────────────────────────────────
# TIME – HA is primary (fast, reliable on esp-idf), SNTP is fallback
# ─────────────────────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: local_time
    timezone: Europe/Budapest
  - platform: sntp
    timezone: Europe/Budapest
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# ─────────────────────────────────────────────────────────────────
# GLOBALS
# ─────────────────────────────────────────────────────────────────
globals:
  # ── Persistent
  - id: slot1_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: slot1_hour
    type: int
    restore_value: yes
    initial_value: "6"

  - id: slot1_minute
    type: int
    restore_value: yes
    initial_value: "0"

  - id: slot2_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: slot2_hour
    type: int
    restore_value: yes
    initial_value: "18"

  - id: slot2_minute
    type: int
    restore_value: yes
    initial_value: "0"

  - id: slot3_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: slot3_hour
    type: int
    restore_value: yes
    initial_value: "7"

  - id: slot3_minute
    type: int
    restore_value: yes
    initial_value: "0"

  - id: slot4_enabled
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: slot4_hour
    type: int
    restore_value: yes
    initial_value: "19"

  - id: slot4_minute
    type: int
    restore_value: yes
    initial_value: "0"

  - id: weather_ok
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: master_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: manual_skip
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: duration_z1
    type: int
    restore_value: yes
    initial_value: "10"

  - id: duration_z2
    type: int
    restore_value: yes
    initial_value: "10"

  - id: duration_z3
    type: int
    restore_value: yes
    initial_value: "10"

  - id: duration_z4
    type: int
    restore_value: yes
    initial_value: "10"

  - id: moisture_skip_threshold
    type: float
    restore_value: yes
    initial_value: "40.0"

  - id: moisture_topup_threshold
    type: float
    restore_value: yes
    initial_value: "20.0"

  - id: last_watered_epoch
    type: int
    restore_value: yes
    initial_value: "0"

  # ── Runtime only
  - id: active_channels
    type: int
    restore_value: no
    initial_value: "0"

  - id: active_traditional
    type: int
    restore_value: no
    initial_value: "0"

  - id: bleed_mode
    type: bool
    restore_value: no
    initial_value: "false"

  - id: schedule_running
    type: bool
    restore_value: no
    initial_value: "false"

  - id: skip_result
    type: bool
    restore_value: no
    initial_value: "false"

  - id: last_run_day_1
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_2
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_3
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_run_day_4
    type: int
    restore_value: no
    initial_value: "-1"

  - id: align_delay_secs
    type: int
    restore_value: no
    initial_value: "0"

# ─────────────────────────────────────────────────────────────────
# SCRIPTS
# ─────────────────────────────────────────────────────────────────
script:
  - id: schedule_poll
    mode: single
    then:
      - delay: !lambda "return (uint32_t)(id(align_delay_secs) * 1000);"
      - while:
          condition:
            lambda: "return true;"
          then:
            - lambda: |-
                auto t = id(local_time).now();
                ESP_LOGI("watering", "Schedule poll – current %02d:%02d", t.hour, t.minute);
                if (t.hour == 0 && t.minute == 0) {
                  if (id(manual_skip)) {
                    id(manual_skip) = false;
                    ESP_LOGI("watering", "Manual skip auto-reset at midnight");
                  }
                }
                struct Slot { bool en; int hr; int mn; int *last; int idx; };
                Slot slots[] = {
                  {id(slot1_enabled), id(slot1_hour), id(slot1_minute), &id(last_run_day_1), 1},
                  {id(slot2_enabled), id(slot2_hour), id(slot2_minute), &id(last_run_day_2), 2},
                  {id(slot3_enabled), id(slot3_hour), id(slot3_minute), &id(last_run_day_3), 3},
                  {id(slot4_enabled), id(slot4_hour), id(slot4_minute), &id(last_run_day_4), 4},
                };
                for (auto &s : slots) {
                  if (s.en && t.hour == s.hr && t.minute == s.mn && *s.last != t.day_of_year) {
                    *s.last = t.day_of_year;
                    ESP_LOGI("watering", "Slot %d firing (%02d:%02d)", s.idx, s.hr, s.mn);
                    id(run_full_schedule).execute();
                    break;
                  }
                }
                int secs_to_next = (5 - (t.minute % 5)) * 60 - t.second + 10;
                if (secs_to_next <= 10) secs_to_next += 300;
                ESP_LOGI("watering", "Next poll in %d seconds", secs_to_next);
                id(align_delay_secs) = secs_to_next;
            - delay: !lambda "return (uint32_t)(id(align_delay_secs) * 1000);"

  # ── CH8 transformer follows any active channel
  - id: update_transformer
    then:
      - if:
          condition:
            lambda: "return id(active_channels) > 0;"
          then:
            - switch.turn_on: relay_ch8_transformer
          else:
            - switch.turn_off: relay_ch8_transformer

  # ── CH7 pump: on while a traditional zone runs, but suppressed in bleed mode
  - id: update_pump
    then:
      - if:
          condition:
            lambda: "return id(active_traditional) > 0 && !id(bleed_mode);"
          then:
            - switch.turn_on: relay_ch7_pump
          else:
            - switch.turn_off: relay_ch7_pump

  - id: check_skip_conditions
    then:
      - lambda: |-
          bool skip = false;
          if (!id(master_enabled)) {
            ESP_LOGI("watering", "Skip: master disabled");
            skip = true;
          }
          if (id(manual_skip)) {
            ESP_LOGI("watering", "Skip: manual skip active");
            skip = true;
          }
          if (!id(weather_ok)) {
            ESP_LOGI("watering", "Skip: weather not OK");
            skip = true;
          }
          id(skip_result) = skip;

  - id: run_full_schedule
    mode: single
    then:
      - script.execute: check_skip_conditions
      - if:
          condition:
            lambda: "return id(skip_result);"
          then:
            - logger.log: "Scheduled run SKIPPED"
            - homeassistant.event:
                event: esphome.watering_skipped
                data: {}
          else:
            - globals.set:
                id: schedule_running
                value: "true"
            - logger.log: "Watering schedule START"
            - homeassistant.event:
                event: esphome.watering_started
                data:
                  trigger: schedule

            - if:
                condition:
                  lambda: "return id(duration_z1) > 0;"
                then:
                  - switch.turn_on: relay_ch1
                  - delay: !lambda "return (uint32_t)(id(duration_z1) * 60000);"
                  - switch.turn_off: relay_ch1
                else:
                  - logger.log: "Zone 1 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z2) > 0;"
                then:
                  - switch.turn_on: relay_ch2
                  - delay: !lambda "return (uint32_t)(id(duration_z2) * 60000);"
                  - switch.turn_off: relay_ch2
                else:
                  - logger.log: "Zone 2 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z3) > 0;"
                then:
                  - switch.turn_on: relay_ch3
                  - delay: !lambda "return (uint32_t)(id(duration_z3) * 60000);"
                  - switch.turn_off: relay_ch3
                else:
                  - logger.log: "Zone 3 skipped (duration 0)"

            - if:
                condition:
                  lambda: "return id(duration_z4) > 0;"
                then:
                  - switch.turn_on: relay_ch6_zone4
                  - delay: !lambda "return (uint32_t)(id(duration_z4) * 60000);"
                  - switch.turn_off: relay_ch6_zone4
                else:
                  - logger.log: "Zone 4 skipped (duration 0)"

            - globals.set:
                id: schedule_running
                value: "false"
            - globals.set:
                id: last_watered_epoch
                value: !lambda "return (int)id(local_time).now().timestamp;"
            - logger.log: "Watering schedule COMPLETE"
            - homeassistant.event:
                event: esphome.watering_complete
                data:
                  trigger: schedule

  # ── Bleed (légtelenítés): runs zones 1-3 with CH7 main valve suppressed
  - id: run_bleed
    mode: single
    then:
      - logger.log: "Légtelenítés START"
      - globals.set:
          id: bleed_mode
          value: "true"
      - globals.set:
          id: schedule_running
          value: "true"
      - homeassistant.event:
          event: esphome.bleed_started
          data: {}

      - if:
          condition:
            lambda: "return id(duration_z1) > 0;"
          then:
            - switch.turn_on: relay_ch1
            - delay: !lambda "return (uint32_t)(id(duration_z1) * 60000);"
            - switch.turn_off: relay_ch1

      - if:
          condition:
            lambda: "return id(duration_z2) > 0;"
          then:
            - switch.turn_on: relay_ch2
            - delay: !lambda "return (uint32_t)(id(duration_z2) * 60000);"
            - switch.turn_off: relay_ch2

      - if:
          condition:
            lambda: "return id(duration_z3) > 0;"
          then:
            - switch.turn_on: relay_ch3
            - delay: !lambda "return (uint32_t)(id(duration_z3) * 60000);"
            - switch.turn_off: relay_ch3

      - globals.set:
          id: bleed_mode
          value: "false"
      - globals.set:
          id: schedule_running
          value: "false"
      - script.execute: update_pump
      - logger.log: "Légtelenítés COMPLETE"
      - homeassistant.event:
          event: esphome.bleed_complete
          data: {}

  - id: emergency_stop
    then:
      - script.stop: run_full_schedule
      - script.stop: run_bleed
      - switch.turn_off: relay_ch1
      - switch.turn_off: relay_ch2
      - switch.turn_off: relay_ch3
      - switch.turn_off: relay_ch6_zone4
      - switch.turn_off: relay_ch7_pump
      - globals.set:
          id: active_channels
          value: "0"
      - globals.set:
          id: active_traditional
          value: "0"
      - globals.set:
          id: bleed_mode
          value: "false"
      - script.execute: update_transformer
      - script.execute: update_pump
      - globals.set:
          id: schedule_running
          value: "false"
      - logger.log: "EMERGENCY STOP – all zones off"
      - homeassistant.event:
          event: esphome.watering_emergency_stop
          data: {}

  - id: restore_schedule_state
    then:
      - logger.log:
          format: "Boot – slots [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d [%d]%02d:%02d master:%d weather_ok:%d manual_skip:%d"
          args:
            - "id(slot1_enabled)"
            - "id(slot1_hour)"
            - "id(slot1_minute)"
            - "id(slot2_enabled)"
            - "id(slot2_hour)"
            - "id(slot2_minute)"
            - "id(slot3_enabled)"
            - "id(slot3_hour)"
            - "id(slot3_minute)"
            - "id(slot4_enabled)"
            - "id(slot4_hour)"
            - "id(slot4_minute)"
            - "id(master_enabled)"
            - "id(weather_ok)"
            - "id(manual_skip)"

# ─────────────────────────────────────────────────────────────────
# SWITCHES
# Pin mapping (active-HIGH relay board):
#   CH1 → G32  Zone 1 (traditional)
#   CH2 → G33  Zone 2 (traditional)
#   CH3 → G25  Zone 3 (traditional)
#   CH4 → G26  (unused)
#   CH5 → G27  (unused)
#   CH6 → G14  Zone 4
#   CH7 → G12  Pump (auto: on with traditional zones, off in bleed mode)
#   CH8 → G13  Transformer
# ─────────────────────────────────────────────────────────────────
switch:
  # CH8 – Transformer (internal, automatic)
  - platform: gpio
    id: relay_ch8_transformer
    name: "Trafó tápellátás"
    pin:
      number: GPIO13
      inverted: false
    internal: true
    restore_mode: ALWAYS_OFF

  # CH7 – Pump (internal, automatic)
  - platform: gpio
    id: relay_ch7_pump
    name: "Szivattyú"
    pin:
      number: GPIO12
      inverted: false
    internal: true
    restore_mode: ALWAYS_OFF

  # CH1 – Zone 1 (traditional)
  - platform: gpio
    id: relay_ch1
    name: "1. zóna"
    icon: mdi:water
    web_server:
      sorting_weight: 10
      sorting_group_id: g_zones
    pin:
      number: GPIO32
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++; id(active_traditional)++;"
        - script.execute: update_transformer
        - script.execute: update_pump
    on_turn_off:
      then:
        - lambda: |-
            if (id(active_channels) > 0) id(active_channels)--;
            if (id(active_traditional) > 0) id(active_traditional)--;
        - script.execute: update_transformer
        - script.execute: update_pump

  # CH2 – Zone 2 (traditional)
  - platform: gpio
    id: relay_ch2
    name: "2. zóna"
    icon: mdi:water
    web_server:
      sorting_weight: 20
      sorting_group_id: g_zones
    pin:
      number: GPIO33
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++; id(active_traditional)++;"
        - script.execute: update_transformer
        - script.execute: update_pump
    on_turn_off:
      then:
        - lambda: |-
            if (id(active_channels) > 0) id(active_channels)--;
            if (id(active_traditional) > 0) id(active_traditional)--;
        - script.execute: update_transformer
        - script.execute: update_pump

  # CH3 – Zone 3 (traditional)
  - platform: gpio
    id: relay_ch3
    name: "3. zóna"
    icon: mdi:water
    web_server:
      sorting_weight: 30
      sorting_group_id: g_zones
    pin:
      number: GPIO25
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++; id(active_traditional)++;"
        - script.execute: update_transformer
        - script.execute: update_pump
    on_turn_off:
      then:
        - lambda: |-
            if (id(active_channels) > 0) id(active_channels)--;
            if (id(active_traditional) > 0) id(active_traditional)--;
        - script.execute: update_transformer
        - script.execute: update_pump

  # CH6 – Zone 4 (no main valve, uses CH8 transformer only)
  - platform: gpio
    id: relay_ch6_zone4
    name: "4. zóna"
    icon: mdi:water
    web_server:
      sorting_weight: 40
      sorting_group_id: g_zones
    pin:
      number: GPIO14
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - lambda: "id(active_channels)++;"
        - script.execute: update_transformer
    on_turn_off:
      then:
        - lambda: "if (id(active_channels) > 0) id(active_channels)--;"
        - script.execute: update_transformer

  # ── Virtual control switches – globals are the source of truth (restore_value: yes)
  - platform: template
    name: "Főkapcsoló"
    id: sw_master_enabled
    icon: mdi:power
    web_server:
      sorting_weight: 10
      sorting_group_id: g_sched
    restore_mode: DISABLED
    lambda: "return id(master_enabled);"
    turn_on_action:
      - globals.set:
          id: master_enabled
          value: "true"
    turn_off_action:
      - globals.set:
          id: master_enabled
          value: "false"
      - if:
          condition:
            lambda: "return id(schedule_running);"
          then:
            - script.execute: emergency_stop

  - platform: template
    name: "Mai kihagyás"
    id: sw_manual_skip
    icon: mdi:skip-next
    web_server:
      sorting_weight: 20
      sorting_group_id: g_sched
    restore_mode: DISABLED
    lambda: "return id(manual_skip);"
    turn_on_action:
      - globals.set:
          id: manual_skip
          value: "true"
      - if:
          condition:
            lambda: "return id(schedule_running);"
          then:
            - script.execute: emergency_stop
    turn_off_action:
      - globals.set:
          id: manual_skip
          value: "false"

  - platform: template
    name: "Időjárás megfelelő"
    id: sw_weather_ok
    icon: mdi:weather-sunny
    web_server:
      sorting_weight: 30
      sorting_group_id: g_sched
    restore_mode: DISABLED
    lambda: "return id(weather_ok);"
    turn_on_action:
      - globals.set:
          id: weather_ok
          value: "true"
    turn_off_action:
      - globals.set:
          id: weather_ok
          value: "false"
      - if:
          condition:
            lambda: "return id(schedule_running);"
          then:
            - script.execute: emergency_stop

  - platform: template
    name: "1. ütem engedélyezve"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_weight: 40
      sorting_group_id: g_sched
    lambda: "return id(slot1_enabled);"
    turn_on_action:
      globals.set:
        id: slot1_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot1_enabled
        value: "false"

  - platform: template
    name: "2. ütem engedélyezve"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 50
      sorting_group_id: g_sched
    lambda: "return id(slot2_enabled);"
    turn_on_action:
      globals.set:
        id: slot2_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot2_enabled
        value: "false"

  - platform: template
    name: "3. ütem engedélyezve"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 60
      sorting_group_id: g_sched
    lambda: "return id(slot3_enabled);"
    turn_on_action:
      globals.set:
        id: slot3_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot3_enabled
        value: "false"

  - platform: template
    name: "4. ütem engedélyezve"
    icon: mdi:calendar-check
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 70
      sorting_group_id: g_sched
    lambda: "return id(slot4_enabled);"
    turn_on_action:
      globals.set:
        id: slot4_enabled
        value: "true"
    turn_off_action:
      globals.set:
        id: slot4_enabled
        value: "false"

# ─────────────────────────────────────────────────────────────────
# BUTTONS
# ─────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Teljes program indítása most"
    icon: mdi:play-circle
    web_server:
      sorting_weight: 5
      sorting_group_id: g_program
    on_press:
      script.execute: run_full_schedule

  - platform: template
    name: "Légtelenítés indítása"
    icon: mdi:air-purifier
    web_server:
      sorting_weight: 10
      sorting_group_id: g_program
    on_press:
      script.execute: run_bleed

  - platform: template
    name: "Vészleállítás"
    icon: mdi:stop-circle
    web_server:
      sorting_weight: 5
      sorting_group_id: g_zones
    on_press:
      script.execute: emergency_stop

# ─────────────────────────────────────────────────────────────────
# DATETIME – schedule slot times (time-only, floored to 5 min)
# ─────────────────────────────────────────────────────────────────
datetime:
  - platform: template
    name: "1. ütem időpont"
    id: slot1_time
    type: time
    icon: mdi:clock-start
    web_server:
      sorting_weight: 45
      sorting_group_id: g_sched
    update_interval: 60s
    lambda: |-
      ESPTime t{};
      t.hour = id(slot1_hour);
      t.minute = id(slot1_minute);
      t.second = 0;
      return t;
    set_action:
      - lambda: |-
          id(slot1_hour) = x.hour;
          id(slot1_minute) = (x.minute / 5) * 5;

  - platform: template
    name: "2. ütem időpont"
    id: slot2_time
    type: time
    icon: mdi:clock-start
    web_server:
      sorting_weight: 55
      sorting_group_id: g_sched
    update_interval: 60s
    lambda: |-
      ESPTime t{};
      t.hour = id(slot2_hour);
      t.minute = id(slot2_minute);
      t.second = 0;
      return t;
    set_action:
      - lambda: |-
          id(slot2_hour) = x.hour;
          id(slot2_minute) = (x.minute / 5) * 5;

